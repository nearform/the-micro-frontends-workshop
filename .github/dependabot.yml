version: 2
updates:
  # `next` bumps: @module-federation/nextjs-mf@8.x declares peer next ^12-^15 but the
  # apps use Next 16, so Dependabot cannot regenerate package-lock.json for them and
  # CI fails on `npm ci`. Fix those PRs by hand: see README "Maintaining Dependencies".
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
        # Pending complete resolution of https://github.com/module-federation/universe/issues/1102
        # This exception should be removed as part of https://github.com/nearform/the-micro-frontends-workshop/issues/32
      - dependency-name: "@module-federation/nextjs-mf"
        versions: ["6.x", "7.x"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
